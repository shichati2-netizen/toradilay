name: Build ToraDelia for Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build Next.js standalone app
        run: npm run build:app
      - name: Build Portable Windows EXE only
        run: npx electron-builder --win portable --x64 --publish never
      - name: Verify portable EXE was created
        shell: pwsh
        run: |
          $exe = "dist-electron/ToraDelia-Kiosk.exe"
          if (!(Test-Path $exe)) {
            throw "Expected portable executable was not created: $exe"
          }
          $file = Get-Item $exe
          if ($file.Length -lt 10MB) {
            throw "Portable EXE looks unexpectedly small: $($file.Length) bytes"
          }
          Write-Host "Verified portable executable: $($file.FullName) - $([math]::Round($file.Length / 1MB, 2)) MB"
      - name: Upload the portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToraDelia-Portable-Windows
          path: dist-electron/ToraDelia-Kiosk.exe
          if-no-files-found: error
          retention-days: 30
      - name: Remove all non-portable release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view windows-latest --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -eq 0) {
            foreach ($asset in $assets) {
              if ($asset -and $asset -ne "ToraDelia-Kiosk.exe") {
                gh release delete-asset windows-latest $asset --yes
                if ($LASTEXITCODE -ne 0) { throw "Failed to remove non-portable release asset: $asset" }
              }
            }
          } else {
            Write-Host "No existing windows-latest release assets to clean."
          }
      - name: Publish latest Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: "תורה דיליה — הגרסה האחרונה ל-Windows"
          overwrite_files: true
          make_latest: true
          body: |
            ## גרסת Windows — Portable בלבד
            הורד והפעל את **ToraDelia-Kiosk.exe** ישירות. אין מתקין ואין צורך בחילוץ ZIP.
            ההגדרות ויומן הפעילות נשמרים מקומית בפרופיל המשתמש. אין צורך ב-PostgreSQL או בקובץ app.env כדי להפעיל את האפליקציה.
          files: dist-electron/ToraDelia-Kiosk.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
