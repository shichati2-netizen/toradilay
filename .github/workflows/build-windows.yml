name: Build ToraDelia for Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set a unique application version for this build
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          npm version $version --no-git-tag-version --ignore-scripts --no-package-lock
          if ($LASTEXITCODE -ne 0) { throw "Failed to set application version $version" }
          Write-Host "Building ToraDelia Kiosk version $version"

      - name: Build Next.js standalone app
        run: npm run build:app

      - name: Build a single portable Windows executable
        run: npx electron-builder --win --x64 --publish never

      - name: Verify the single-file portable executable
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          $exe = "dist-electron/ToraDelia-Kiosk-v$version.exe"
          if (!(Test-Path $exe)) { throw "Portable executable not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 20MB) { throw "Portable executable looks incomplete: $([math]::Round($item.Length / 1MB, 2)) MB" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "Verified single-file Portable app: $($item.Name)"
          Write-Host "Size: $([math]::Round($item.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Upload single-file Portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ToraDelia-Kiosk-Windows-v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-electron/ToraDelia-Kiosk-v1.0.${{ github.run_number }}-${{ github.run_attempt }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable versioned Windows release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: "תורה דיליה — Windows v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          overwrite_files: false
          make_latest: true
          body: |
            ## תורה דיליה — גרסת Windows v1.0.${{ github.run_number }}-${{ github.run_attempt }}

            קובץ Portable יחיד — אין צורך לחלץ תיקייה עם אלפי קבצים.
            הורד את קובץ ה-EXE והפעל אותו ישירות. גרסאות קודמות נשמרות עם תגית וקובץ נפרדים.

            ההגדרות ויומן הפעילות נשמרים מקומית בפרופיל המשתמש. אין צורך ב-PostgreSQL או בקובץ app.env להפעלה.
          files: dist-electron/ToraDelia-Kiosk-v1.0.${{ github.run_number }}-${{ github.run_attempt }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
