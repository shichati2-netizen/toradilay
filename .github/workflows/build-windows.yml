name: Build ToraDelia for Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build Next.js standalone app
        run: npm run build:app
      - name: Build Portable Windows EXE only
        run: npx electron-builder --win portable --x64 --publish never
      - name: Package EXE into the only ZIP deliverable
        shell: pwsh
        run: |
          $exe = "dist-electron/ToraDelia-Kiosk.exe"
          $zip = "dist-electron/ToraDelia-Kiosk-Windows.zip"
          if (!(Test-Path $exe)) {
            throw "Expected portable executable was not created: $exe"
          }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Push-Location "dist-electron"
          try {
            Compress-Archive -Path "ToraDelia-Kiosk.exe" -DestinationPath "ToraDelia-Kiosk-Windows.zip" -CompressionLevel Optimal
          } finally {
            Pop-Location
          }
      - name: Verify ZIP contains only the portable EXE
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path "dist-electron/ToraDelia-Kiosk-Windows.zip").Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            if ($archive.Entries.Count -ne 1) {
              throw "ZIP must contain exactly one file; found $($archive.Entries.Count)."
            }
            if ($archive.Entries[0].FullName -ne "ToraDelia-Kiosk.exe") {
              throw "Unexpected ZIP entry: $($archive.Entries[0].FullName)"
            }
            Write-Host "Verified $($archive.Entries[0].FullName) - $([math]::Round($archive.Entries[0].Length / 1MB, 2)) MB"
          } finally {
            $archive.Dispose()
          }
          Write-Host "ZIP size: $([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
      - name: Upload the single ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToraDelia-Windows-ZIP
          path: dist-electron/ToraDelia-Kiosk-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: "תורה דיליה — הגרסה האחרונה ל-Windows"
          overwrite_files: true
          make_latest: true
          body: |
            ## גרסת Windows
            הורד את **ToraDelia-Kiosk-Windows.zip** וחלץ אותו. בתוך ה-ZIP נמצא קובץ יחיד: **ToraDelia-Kiosk.exe** (גרסת Portable).
            ההגדרות ויומן הפעילות נשמרים מקומית בפרופיל המשתמש. אין צורך ב-PostgreSQL או בקובץ app.env כדי להפעיל את האפליקציה.
          files: dist-electron/ToraDelia-Kiosk-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
