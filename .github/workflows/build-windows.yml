name: Build ToraDelia for Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set a unique application version for this build
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          npm version $version --no-git-tag-version --ignore-scripts --no-package-lock
          if ($LASTEXITCODE -ne 0) { throw "Failed to set application version $version" }
          Write-Host "Building ToraDelia Kiosk version $version"

      - name: Build Next.js standalone app
        run: npm run build:app

      - name: Build unpacked Portable Windows application
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Verify and package the complete Portable folder as ZIP
        shell: pwsh
        run: |
          $app = "dist-electron/win-unpacked"
          $exe = Join-Path $app "ToraDelia-Kiosk.exe"
          $server = Join-Path $app "resources/app/standalone/server.js"
          $main = Join-Path $app "resources/app/electron/main.cjs"
          foreach ($required in @($exe, $server, $main)) {
            if (!(Test-Path $required)) { throw "Required Portable application file is missing: $required" }
          }
          $version = "1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          $zip = "dist-electron/ToraDelia-Kiosk-Windows-v$version.zip"
          Compress-Archive -Path "$app/*" -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
            foreach ($requiredEntry in @("ToraDelia-Kiosk.exe", "resources/app/standalone/server.js", "resources/app/electron/main.cjs")) {
              if ($names -notcontains $requiredEntry) { throw "ZIP is missing required entry: $requiredEntry" }
            }
            if ($archive.Entries.Count -lt 20) { throw "ZIP does not look like a complete application folder: only $($archive.Entries.Count) entries found" }
            Write-Host "Verified complete Portable ZIP version $version with $($archive.Entries.Count) entries"
          } finally { $archive.Dispose() }
          Write-Host "ZIP size: $([math]::Round((Get-Item $zip).Length / 1MB, 2)) MB"

      - name: Upload complete Portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToraDelia-Portable-Windows-v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-electron/ToraDelia-Kiosk-Windows-v1.0.${{ github.run_number }}-${{ github.run_attempt }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable versioned Windows release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: "תורה דיליה — Windows v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          overwrite_files: false
          make_latest: true
          body: |
            ## תורה דיליה — גרסת Windows v1.0.${{ github.run_number }}-${{ github.run_attempt }}

            הורד את קובץ ה-ZIP וחלץ את כל התוכן לתיקייה אחת, תוך שמירת מבנה התיקיות. הפעל את **ToraDelia-Kiosk.exe** שבשורש התיקייה. ה-ZIP מכיל את התוכנה ואת קובצי השרת והמשאבים; אין מתקין.

            כל גרסה נשמרת ב-ZIP ובתגית נפרדים. גרסאות קודמות אינן נמחקות או נדרסות.
            ההגדרות ויומן הפעילות נשמרים מקומית בפרופיל המשתמש. אין צורך ב-PostgreSQL או בקובץ app.env כדי להפעיל את האפליקציה.
          files: dist-electron/ToraDelia-Kiosk-Windows-v1.0.${{ github.run_number }}-${{ github.run_attempt }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
